name: Docker Build (Dev)

on:
  push:
    branches: ["feature/circuit-breaker-builtin"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: transports/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-cb-persist
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-cb-persist-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
